<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="PixelSteg container format"><style>text{font-family:Segoe UI,Arial;fill:#f2f5f9;font-size:15px}.label{font-size:19px;font-weight:bold}.b{stroke:#10131a;stroke-width:3}</style><rect width="960" height="190" fill="#10131a"/><text x="35" y="43" class="label">Bytes packed into lossless RGB PNG pixels</text><rect class="b" x="35" y="75" width="100" height="55" fill="#52d2a6"/><text x="61" y="108">PSTG</text><rect class="b" x="135" y="75" width="100" height="55" fill="#457b9d"/><text x="154" y="108">v1</text><rect class="b" x="235" y="75" width="185" height="55" fill="#3d5a80"/><text x="266" y="108">name length + name</text><rect class="b" x="420" y="75" width="145" height="55" fill="#6d597a"/><text x="447" y="108">payload length</text><rect class="b" x="565" y="75" width="125" height="55" fill="#bc6c25"/><text x="600" y="108">SHA-256</text><rect class="b" x="690" y="75" width="235" height="55" fill="#8ab17d"/><text x="772" y="108">payload bytes</text><text x="35" y="165">Little-endian fixed fields. Decode verifies the digest before it writes output.</text></svg>
